<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="https://cazllsidgvysyxbvrftq.supabase.co/storage/v1/object/public/images-sacviet/logo.png?v=3" />
    <title>Hồ Sơ Đề Án Sắc Việt | Cuộc Thi Sinh Viên Kinh Doanh Số 2026 (DBC)</title>
    <meta name="description" content="Website Báo cáo Đề án Khởi nghiệp Sắc Việt - Nền tảng kết nối chợ phiên đến với muôn phương. Đội thi Trường Đại học Lạc Hồng tại Cuộc thi Sinh viên Kinh doanh số 2026." />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Sử dụng đồng bộ 100% Font Roboto chuẩn Tiếng Việt -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'primary': '#990000',
              'primary-dark': '#6B0000',
              'gold': '#C59100',
              'gold-light': '#F6E0A4',
              'background-light': '#F9F5EA',
              'text-main': '#420808',
              'text-soft': '#754B4B',
              'bronze': '#8B5A2B',
            },
            fontFamily: {
              'sans': ['"Roboto"', 'sans-serif'],
              'display': ['"Roboto"', 'sans-serif'],
              'serif': ['"Roboto"', 'sans-serif'],
            },
          }
        }
      }
    </script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      html {
        scroll-behavior: smooth;
        overflow-x: hidden;
        font-family: 'Roboto', sans-serif;
      }
      body {
        background-color: #F9F5EA;
        color: #420808;
        position: relative;
        min-height: 100vh;
        overflow-x: hidden;
        font-family: 'Roboto', sans-serif;
        line-height: 1.6;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
        opacity: 0.45;
        z-index: -1;
        pointer-events: none;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F6E0A4;
      }
      ::-webkit-scrollbar-thumb {
        background: #990000;
        border-radius: 3px;
      }
      .glass-card {
        background: rgba(255, 252, 245, 0.94);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(197, 145, 0, 0.3);
      }
    </style>
  </head>
  <body class="font-sans antialiased selection:bg-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
